spring:
  application:
    name: quedate-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-dev-secret-at-least-32-characters-long}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${REFRESH_EXPIRATION:604800000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${SMTP_FROM:no-reply@quedate.com}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}