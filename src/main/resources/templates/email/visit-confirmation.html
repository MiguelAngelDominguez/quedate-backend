<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Visita confirmada</title>
</head>
<body>
<h1>Visita confirmada</h1>

<p>
    La visita ha sido confirmada.
</p>

<div th:if="${visit != null}">
    <p>
        Fecha y hora:
        <span th:text="${visit.scheduledAt}">
            -
        </span>
    </p>

    <p>
        Notas:
        <span th:text="${visit.notes}">
            Sin notas
        </span>
    </p>
</div>
</body>
</html>
