services:
  db:
    image: postgres:16-alpine
    container_name: quedate-db
    environment:
      POSTGRES_DB: quedate
      POSTGRES_USER: quedate
      POSTGRES_PASSWORD: quedate
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quedate -d quedate"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: quedate-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/quedate
      DB_USERNAME: quedate
      DB_PASSWORD: quedate
      JWT_SECRET: ${JWT_SECRET:-change-me-prod-secret-at-least-32-characters-long}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      REFRESH_EXPIRATION: ${REFRESH_EXPIRATION:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@quedate.com}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    ports:
      - "8080:8080"

volumes:
  db-data: